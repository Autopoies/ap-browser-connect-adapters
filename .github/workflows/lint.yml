name: Lint runtime data

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  runtime-data-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install jsonschema pyyaml
      - name: Lint adapter YAML
        run: python3 scripts/lint_adapters.py sites/ --schema scripts/adapter-schema.json
      - name: Lint filter YAML
        run: python3 scripts/lint_filters.py filters/ --schema scripts/filter-schema.json
      - name: Test filter linter fixtures
        run: python3 -m unittest discover -s tests -p 'test_*.py'
