site: instagram
name: search
description: Search Instagram keyword results (requires login)

args:
  query:
    type: string
    required: true
  limit:
    type: int
    default: 24
  scrolls:
    type: int
    default: 2

output:
  type: array
  fields: [type, url, thumbnail, text]

steps:
  - goto: "https://www.instagram.com/explore/search/keyword/?q={{args.query}}"
  - wait: "body"
  - scroll:
      count: "{{args.scrolls}}"
      pause_ms: 2200
  - eval: search.js
