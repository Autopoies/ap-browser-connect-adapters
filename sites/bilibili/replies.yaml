site: bilibili
name: replies
description: Fetch reply notifications (who replied to your comments)

args:
  limit:
    type: int
    default: 30
    desc: max number of replies to return
  scrolls:
    type: int
    default: 2
    desc: scroll-to-bottom count to trigger lazy loading

output:
  type: array
  fields: [user, action, replied_to, content, time]

steps:
  - goto: "https://message.bilibili.com/#/reply"
  - wait: ".interaction-item"
  - scroll:
      selector: ".message-content__wrapper"
      count: "{{args.scrolls}}"
      pause_ms: 1000
  - eval: replies.js
