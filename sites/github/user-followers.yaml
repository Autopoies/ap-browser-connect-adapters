site: github
name: user-followers
description: List a GitHub user's followers

args:
  username:
    type: string
    required: true
    desc: github username
  limit:
    type: int
    default: 50
    desc: max number of followers per page (50 per page)
  scrolls:
    type: int
    default: 2
    desc: scroll count (followers page lazy-loads more)

output:
  type: array
  fields: [username, name, url]

steps:
  - goto: "https://github.com/{{args.username}}?tab=followers"
  - wait: "a[data-hovercard-type='user']"
  - scroll:
      count: "{{args.scrolls}}"
      pause_ms: 1000
  - eval: user-followers.js
