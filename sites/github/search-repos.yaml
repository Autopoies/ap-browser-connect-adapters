site: github
name: search-repos
description: Search GitHub repositories by query

args:
  query:
    type: string
    required: true
    desc: search query (e.g. "stars:>1000 language:rust")
  limit:
    type: int
    default: 30
    desc: max number of repos
  sort:
    type: string
    desc: sort key — stars | forks | help-wanted-issues | updated

output:
  type: array
  fields: [name, url, description, stars, language]

steps:
  - goto: "https://api.github.com/search/repositories?q={{args.query}}&sort={{args.sort}}&per_page={{args.limit}}"
  - wait: "pre"
  - eval: search-repos.js
