site: google-docs
name: find
description: Count exact, case-sensitive matches of a text in the live Google Docs document (includes pending suggested insertions)

args:
  text:
    type: string
    required: true
    desc: Exact single-line text (or Docs regex pattern when --regex true) to look for
  regex:
    type: bool
    default: false
    desc: Enable Google Docs "Match using regular expressions" (supports \n for paragraph breaks, \s+, and whitespace-only patterns)
  doc:
    type: string
    default: ''
    desc: Document URL or ID; omit to use the document in the operated tab
  type:
    type: string
    default: document
    desc: Type lock. Only "document" is accepted; Sheets/Slides targets are rejected

output:
  type: object
  fields: [doc_type, doc_id, title, url, status, text, count, mode]

steps:
  - eval: lib.js
  - eval: editor.js
  - wait:
      eval: ready.js
      initial_delay_ms: 300
      timeout_ms: 25000
      interval_ms: 300
  - eval: lib.js
  - eval: find-init.js
  - eval: begin.js
  - click: '#docs-edit-menu'
  - eval: find-pick.js
  - click: '[data-apb-gdocs-click]'
  - eval: find-prepare.js
  - fill:
      selector: '[data-apb-gdocs-find]'
      value: '{{args.text}}'
  - eval: find-count.js
  - press: Escape
  - eval: result.js
