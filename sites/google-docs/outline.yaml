site: google-docs
name: outline
description: List the headings of a Google Docs document with levels and deep-link anchors

args:
  doc:
    type: string
    default: ''
    desc: Document URL or ID; omit to use the document in the operated tab
  type:
    type: string
    default: document
    desc: Type lock. Only "document" is accepted; Sheets/Slides targets are rejected
  # Not `tab`: the CLI's global --tab selects the browser tab.
  doc_tab:
    type: string
    default: ''
    desc: Document tab ID inside the doc (e.g. t.0); defaults to the tab in the URL, else the first tab

output:
  type: object
  fields: [doc_type, doc_id, title, url, tab, count, headings]

steps:
  - eval: lib.js
  - eval: outline.js
