site: google-docs
name: insert
description: Insert text right after a unique anchor text in a Google Docs document (as a suggestion by default)

args:
  after:
    type: string
    default: ''
    desc: Required. Exact anchor text (case-sensitive, single line, must match exactly once); the text is inserted right after it
  text:
    type: string
    required: true
    desc: Text to insert; newlines become paragraph breaks (start with a newline to begin a new paragraph)
  html:
    type: bool
    default: false
    desc: Treat --text as an HTML fragment (bold, colors, links, lists, headings, styled tables) instead of plain text
  mode:
    type: string
    default: suggest
    desc: suggest (default — the change becomes a suggestion for a human to accept) or edit (change the text directly)
  doc:
    type: string
    default: ''
    desc: Document URL or ID; omit to use the document in the operated tab
  type:
    type: string
    default: document
    desc: Type lock. Only "document" is accepted; Sheets/Slides targets are rejected

# Writes drive the live editor through its own menus and dialogs; keep the
# tab so a pending save is never cut off by an auto-closed tab.
timeout: 90
keep_tab: true

output:
  type: object
  fields: [doc_type, doc_id, title, url, status, verified, verified_by, after, chars, format, mode, previous_mode, saved, hint]

steps:
  - eval: lib.js
  - eval: editor.js
  - wait:
      eval: ready.js
      initial_delay_ms: 300
      timeout_ms: 25000
      interval_ms: 300
  - eval: lib.js
  - eval: insert-init.js
  - eval: begin.js
  - click: '#docs-toolbar-mode-switcher'
  - eval: mode-pick.js
  - click: '[data-apb-gdocs-click]'
  - click: '#docs-edit-menu'
  - eval: find-pick.js
  - click: '[data-apb-gdocs-click]'
  - eval: find-prepare.js
  - fill:
      selector: '[data-apb-gdocs-find]'
      value: '{{args.after}}'
  - eval: find-count.js
  - press: Escape
  - eval: caret.js
  - press: ArrowRight
  - eval: paste.js
  - eval: result.js
