site: google-docs
name: comments
description: List open comments with their anchored context; adds live comment threads and pending suggestions when the document is open in the tab

args:
  doc:
    type: string
    default: ''
    desc: Document URL or ID; omit to use the document in the operated tab
  type:
    type: string
    default: document
    desc: Type lock. Only "document" is accepted; Sheets/Slides targets are rejected
  # Not `tab`: the CLI's global --tab selects the browser tab.
  doc_tab:
    type: string
    default: ''
    desc: Document tab ID inside the doc (e.g. t.0); defaults to the tab in the URL, else the first tab

output:
  type: object
  fields: [doc_type, doc_id, title, url, tab, count, comments, live_threads, note]

steps:
  - eval: lib.js
  - eval: comments.js
