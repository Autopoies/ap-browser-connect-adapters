site: google-docs
name: mode
description: Switch the open Google Docs document between suggest, edit and view mode

args:
  set:
    type: string
    required: true
    desc: suggest, edit or view
  doc:
    type: string
    default: ''
    desc: Document URL or ID; omit to use the document in the operated tab
  type:
    type: string
    default: document
    desc: Type lock. Only "document" is accepted; Sheets/Slides targets are rejected

output:
  type: object
  fields: [doc_type, doc_id, title, url, status, mode, previous_mode]

steps:
  - eval: lib.js
  - eval: editor.js
  - wait:
      eval: ready.js
      initial_delay_ms: 300
      timeout_ms: 25000
      interval_ms: 300
  - eval: lib.js
  - eval: mode-init.js
  - eval: begin.js
  - click: '#docs-toolbar-mode-switcher'
  - eval: mode-pick.js
  - click: '[data-apb-gdocs-click]'
  - eval: mode-result.js
