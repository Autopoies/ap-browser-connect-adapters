site: tiktok
name: user
description: Fetch recent videos from a TikTok user profile

args:
  username:
    type: string
    required: true
  limit:
    type: int
    default: 20
  scrolls:
    type: int
    default: 3

output:
  type: array
  fields: [description, url, likes, comments]

steps:
  - goto: "https://www.tiktok.com/@{{args.username}}"
  - wait: "body"
  - scroll:
      count: "{{args.scrolls}}"
      pause_ms: 2000
  - eval: user.js
