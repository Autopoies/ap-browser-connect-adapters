site: tiktok
name: search
description: Search TikTok videos

args:
  query:
    type: string
    required: true
  limit:
    type: int
    default: 20
  scrolls:
    type: int
    default: 3

output:
  type: array
  fields: [creator, description, url, likes, comments]

steps:
  - goto: "https://www.tiktok.com/search?q={{args.query}}"
  - wait: "body"
  - scroll:
      count: "{{args.scrolls}}"
      pause_ms: 2000
  - eval: search.js
