site: twitter
name: timeline
description: Fetch tweets from the home timeline (requires login)

args:
  limit:
    type: int
    default: 20
    desc: max number of tweets
  scrolls:
    type: int
    default: 3
    desc: scroll count for infinite feed

output:
  type: array
  fields: [author, handle, text, url, time, replies, retweets, likes]

steps:
  - goto: "https://x.com/home"
  - wait:
      selector: "article[data-testid='tweet']"
      timeout_ms: 15000
  - scroll:
      count: "{{args.scrolls}}"
      pause_ms: 2500
  - eval: timeline.js
