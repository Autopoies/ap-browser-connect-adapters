site: substack
name: feed
description: Read Substack posts for a publication or topic search

args:
  query:
    type: string
    default: technology
    desc: publication or topic keyword
  limit:
    type: int
    default: 10
    desc: max posts
  scrolls:
    type: int
    default: 2
    desc: scroll passes before extraction

output:
  type: array
  fields: [title, url, publication, author]

steps:
  - goto: "https://substack.com/search/posts?search={{args.query}}"
  - wait: "a[href*='/p/'], a[href*='/note/']"
  - scroll:
      count: "{{args.scrolls}}"
      pause_ms: 1000
  - eval: feed.js
