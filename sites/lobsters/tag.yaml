site: lobsters
name: tag
description: Fetch Lobsters stories filtered by tag (e.g. rust, security)

args:
  tag:
    type: string
    required: true
    desc: tag name (e.g. rust, security, programming)
  limit:
    type: int
    default: 25
    desc: max number of stories per page
  page:
    type: int
    default: 1
    desc: page number (25 stories per page)

output:
  type: array
  fields: [title, url, score, comments_count, comments_url, tags, author]

steps:
  - goto: "https://lobste.rs/t/{{args.tag}}?page={{args.page}}"
  - wait: ".story"
  - eval: tag.js
