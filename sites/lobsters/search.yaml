site: lobsters
name: search
description: Search Lobsters stories

args:
  query:
    type: string
    required: true
    desc: search keyword
  limit:
    type: int
    default: 20
    desc: max number of stories

output:
  type: array
  fields: [title, url, score, comments_count, comments_url, tags, author]

steps:
  - goto: "https://lobste.rs/search?q={{args.query}}&what=stories&order=newest"
  - wait: ".story"
  - eval: search.js
