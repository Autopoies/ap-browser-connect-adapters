site: lobsters
name: user-stories
description: Fetch stories submitted by a Lobsters user

args:
  username:
    type: string
    required: true
    desc: username (without ~)
  limit:
    type: int
    default: 25
    desc: max number of stories
  page:
    type: int
    default: 1
    desc: page number

output:
  type: array
  fields: [title, url, score, comments_count, comments_url, tags, author]

steps:
  - goto: "https://lobste.rs/newest/{{args.username}}?page={{args.page}}"
  - wait: ".story"
  - eval: hot.js
