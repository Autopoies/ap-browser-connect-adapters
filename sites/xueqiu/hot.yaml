site: xueqiu
name: hot
description: Fetch visible trending stocks/topics from Xueqiu market page

args:
  limit:
    type: int
    default: 20
    desc: max results

output:
  type: array
  fields: [title, url]

steps:
  - goto: "https://xueqiu.com/hq#exchange=CN&firstname=home"
  - wait: "body"
  - eval: hot.js
