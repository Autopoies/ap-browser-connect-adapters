---
site: chatgpt
name: wait
description: Wait until ChatGPT finishes active thinking, search, and generation

output:
  type: object
  fields:
    - completed
    - matched
    - reason
    - waited_ms
    - current_status

steps:
  - wait:
      eval: status.js
      when:
        isGenerating: false
      # False-positive guard: right after send, status is briefly idle with no
      # response yet — without this the wait returns "completed" in the dead
      # window before generation starts.
      require_started: true
      initial_delay_ms: 300
      timeout_ms: 300000
      interval_ms: 1000
