---
site: chatgpt
name: wait
description: Wait until ChatGPT finishes active thinking, search, and generation

output:
  type: object
  fields:
    - completed
    - matched
    - reason
    - waited_ms
    - current_status

steps:
  - wait:
      eval: status.js
      when:
        isGenerating: false
      initial_delay_ms: 500
      timeout_ms: 300000
      interval_ms: 1000
