---
site: chatgpt
name: send
description: >-
  Type and submit a prompt to ChatGPT with optional mode and effort
long_running: true

wait_strategy:
  eval: status.js
  when:
    isGenerating: false
  # See wait.yaml: blocks the idle-before-first-token false positive.
  require_started: true
  initial_delay_ms: 300
  timeout_ms: 300000
  interval_ms: 1000

hints:
  long_running: >-
    ChatGPT generation in progress. Pass --wait to wait until completion,
    or run 'ap-browser chatgpt wait'.
  in_flight: >-
    ChatGPT is still thinking or generating in background. Run 'ap-browser
    chatgpt wait' to continue waiting, or 'ap-browser chatgpt read' to
    inspect output.

args:
  prompt:
    type: string
    required: true
    desc: prompt text to send
  model:
    type: string
    default: ""
    desc: optional model name or substring (e.g. 'gpt-5.6', 'o3', 'gpt-4o')
  mode:
    type: string
    default: ""
    desc: optional mode (deep-research, web-search, image-gen)
  effort:
    type: string
    default: ""
    desc: optional thinking effort (high, medium, low, pro, instant)

output:
  type: object
  fields: [sent, submitted]

steps:
  - wait:
      selector: "#prompt-textarea, textarea, div[contenteditable='true']"
      timeout_ms: 10000
  - eval: send-modes.js
  # Typing and submission go through the REAL input pipeline (CDP):
  # page-JS execCommand types text the DOM can see but ProseMirror/React
  # state ignores, and synthetic KeyboardEvent/button.click() never trigger
  # the submit handler — the prompt sat in the composer forever.
  - fill:
      selector: "#prompt-textarea, textarea, div[contenteditable='true']"
      value: "{{args.prompt}}"
  # No bare `press: Enter` here: fired back-to-back with fill it races
  # ProseMirror's input flush and eats the text without submitting.
  # send-verify.js drives submission (button click, retried) and only
  # accepts on observed generation/response.
  - eval: send-verify.js
