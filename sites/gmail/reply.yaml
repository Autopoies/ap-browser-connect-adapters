---
site: gmail
name: reply
description: Reply or Reply All to an email thread with optional attachment

args:
  body:
    type: string
    required: true
    desc: Reply message body
  id:
    type: string
    required: false
    default: ""
    desc: Optional thread ID to open before replying
  reply_all:
    type: bool
    required: false
    default: false
    desc: Whether to reply to all recipients
  attachment_name:
    type: string
    required: false
    default: ""
    desc: Optional attachment filename
  attachment_content:
    type: string
    required: false
    default: ""
    desc: Optional attachment text or base64 data
  attachment_type:
    type: string
    required: false
    default: "text/plain"
    desc: MIME type for attachment

# Retain the auto-tab through Undo Send, including uncertain/error results.
timeout: 150
keep_tab: true

output:
  type: object
  fields: [account, sent, threadId, subject, replyAll, hasAttachment, status, confirmation, verified, error, hint, retrySafe]

steps:
  - eval: compose-safety.js
  - eval: reply.js
  - fill:
      selector: '[data-apb-gmail-body]'
      value: '{{args.body}}'
  - eval: submit.js
