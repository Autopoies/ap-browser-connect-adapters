site: gmail
name: drafts
description: List draft emails in Gmail

args:
  page:
    type: int
    required: false
    default: 1
    desc: Page number (1-based)
  limit:
    type: int
    required: false
    default: 25
    desc: Maximum number of drafts to return

output:
  type: object
  fields: [account, folder, page, total, drafts]

steps:
  - eval: drafts.js
