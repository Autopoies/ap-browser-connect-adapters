site: gmail
name: sent
description: List sent emails in Gmail

args:
  page:
    type: int
    required: false
    default: 1
    desc: Page number (1-based)
  limit:
    type: int
    required: false
    default: 25
    desc: Maximum number of sent emails to return

output:
  type: object
  fields: [account, folder, page, total, emails]

steps:
  - eval: sent.js
