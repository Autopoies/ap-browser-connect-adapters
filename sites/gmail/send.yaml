---
site: gmail
name: send
description: Compose and send an email with optional CC, BCC, and attachment

args:
  to:
    type: string
    required: true
    desc: Recipient email address(es), comma-separated
  subject:
    type: string
    required: false
    default: ""
    desc: Email subject line
  body:
    type: string
    required: false
    default: ""
    desc: Email body content
  cc:
    type: string
    required: false
    default: ""
    desc: Optional CC recipient(s), comma-separated
  bcc:
    type: string
    required: false
    default: ""
    desc: Optional BCC recipient(s), comma-separated
  attachment_name:
    type: string
    required: false
    default: ""
    desc: Optional attachment filename
  attachment_content:
    type: string
    required: false
    default: ""
    desc: Optional attachment text or base64 data
  attachment_type:
    type: string
    required: false
    default: "text/plain"
    desc: MIME type for attachment (e.g. text/plain, application/pdf)

# Sending is asynchronous (up to 30s Undo Send + attachment upload).
# Retain auto-tabs even on uncertainty; closing can cancel a queued send.
timeout: 150
keep_tab: true

output:
  type: object
  fields: [account, sent, to, subject, hasAttachment, status, confirmation, verified, error, hint, retrySafe]

steps:
  - eval: compose-safety.js
  - eval: open-compose.js
  - click: '[data-apb-gmail-expand]'
  - click: '[data-apb-gmail-cc-toggle]'
  - click: '[data-apb-gmail-bcc-toggle]'
  - eval: send.js
  - fill:
      selector: '[data-apb-gmail-to]'
      value: '{{args.to}}'
  - press: Enter
  - fill:
      selector: '[data-apb-gmail-cc]'
      value: '{{args.cc}}'
  - press: Enter
  - fill:
      selector: '[data-apb-gmail-bcc]'
      value: '{{args.bcc}}'
  - press: Enter
  - fill:
      selector: '[data-apb-gmail-subject]'
      value: '{{args.subject}}'
  - fill:
      selector: '[data-apb-gmail-body]'
      value: '{{args.body}}'
  - eval: submit.js
