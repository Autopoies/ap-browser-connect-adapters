site: gmail
name: spam
description: List spam emails in Gmail

args:
  page:
    type: int
    required: false
    default: 1
    desc: Page number (1-based)
  limit:
    type: int
    required: false
    default: 25
    desc: Maximum number of spam emails to return

output:
  type: object
  fields: [account, folder, page, total, emails]

steps:
  - eval: spam.js
