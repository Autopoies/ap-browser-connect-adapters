---
site: muse
name: send
description: >-
  Type and submit a message to the Muse agent
long_running: true
keep_tab: true

wait_strategy:
  eval: status.js
  when:
    settled: true
  initial_delay_ms: 300
  timeout_ms: 300000
  interval_ms: 1000

hints:
  long_running: >-
    Muse generation in progress. Pass --wait to wait until completion,
    or run 'ap-browser muse wait'.
  in_flight: >-
    Muse is still generating in background. Run 'ap-browser muse wait'
    to continue waiting, or 'ap-browser muse read' to inspect output.

args:
  prompt:
    type: string
    required: true
    desc: message text to send

output:
  type: object
  fields: [sent, submitted, userTurns]

# Every step is either a CLI-side wait (polls a state expression) or a
# synchronous eval/fill/press, so a background tab cannot stall the send.
steps:
  # Read-only channels (WhatsApp) cannot take a message: refuse before typing.
  - eval: send-guard.js
  - wait:
      selector: "textarea"
      timeout_ms: 10000
  - eval: send-prepare.js
  # Typing goes through the REAL input pipeline (CDP insertText) so the React
  # state of the composer updates; synthetic input events do not.
  - fill:
      selector: "textarea"
      value: "{{args.prompt}}"
  # Wait until the composer actually holds the text before submitting, so the
  # Enter key is not fired into an unflushed input.
  - wait:
      eval: composer-ready.js
      when:
        hasText: true
      initial_delay_ms: 100
      timeout_ms: 3000
      interval_ms: 100
  # Enter is pressed exactly once. Nothing re-presses it, so no double send.
  - press: Enter
  - wait:
      eval: send-state.js
      when:
        accepted: true
      timeout_ms: 15000
      interval_ms: 300
  - eval: send-verify.js
