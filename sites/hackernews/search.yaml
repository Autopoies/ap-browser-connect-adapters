site: hackernews
name: search
description: Search HackerNews stories via Algolia API (no login)

args:
  query:
    type: string
    required: true
    desc: search keyword
  limit:
    type: int
    default: 20
    desc: max number of stories (Algolia returns 20 per page)

output:
  type: array
  fields: [id, title, url, points, author, num_comments, created_at]

steps:
  - goto: "https://hn.algolia.com/api/v1/search?query={{args.query}}&tags=story"
  - wait: "pre"
  - eval: search.js
